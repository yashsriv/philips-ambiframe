name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle and validates the wrapper jar.
      - uses: gradle/actions/setup-gradle@v5

      # The runner image ships the Android SDK with licences accepted; AGP fetches platform 36 if missing.
      - name: Build, unit tests and lint
        run: |
          set -o pipefail
          ./gradlew --console=plain assembleDebug test lint 2>&1 | tee build.log

      # Annotations are readable without signing in, unlike the log.
      - name: Report Gradle failure
        if: failure()
        run: |
          msg=$( { sed -n '/What went wrong:/,/\* Try:/p' build.log; grep -E ' FAILED$|^e: ' build.log; } | head -60)
          [ -n "$msg" ] || msg=$(tail -60 build.log)
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/'%0D'}"; msg="${msg//$'\n'/'%0A'}"
          echo "::error title=Gradle build failed::$msg"

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build.log
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ambiframe-debug-apk
          path: app/build/outputs/apk/debug/*.apk
